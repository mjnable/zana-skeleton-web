name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Fails on a known vulnerability in a dependency (FE-68).
      - run: composer audit
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: vendor/bin/phpunit
      # Wiring, architecture rules and routes, in the testing environment (no .env needed).
      # Once mj-zana/database is installed, check a migrated file, not the tests' database in memory, which every
      # command starts empty: add pdo_sqlite to the extensions above, and replace this step with
      #   - name: check, on a migrated database
      #     env:
      #       APP_ENV: testing
      #       APP_DATABASE__CONNECTIONS__MAIN__DATABASE: ${{ runner.temp }}/ci.sqlite
      #     run: |
      #       php bin/console migrate
      #       php bin/console check
      - run: APP_ENV=testing php bin/console check
